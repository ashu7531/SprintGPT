name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # User's Hugging Face Username
          HF_USERNAME="ashu7531"

          # Create a clean directory for staging
          mkdir hf_space
          cp -r backend/* hf_space/
          cd hf_space
          
          # Initialize a git repo from scratch
          git init
          git checkout -b main
          git config user.email "deploy-bot@sprintgpt.com"
          git config user.name "Deploy Bot"
          
          # Add and commit the files
          git add -A
          git commit -m "Deploy: Sync from GitHub commit ${GITHUB_SHA}"
          
          # Force push directly to the Hugging Face Space repository (avoids clone rate limit)
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/sprintgpt-backend main --force
